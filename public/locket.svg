<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c44569;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <!-- Locket shape - heart with keyhole -->
  <g transform="translate(50, 52)">
    <!-- Heart shape -->
    <path d="M0-20 C-10-30 -25-25 -25-10 C-25 5 0 25 0 25 C0 25 25 5 25-10 C25-25 10-30 0-20Z"
          fill="url(#heart)" opacity="0.9"/>
    <!-- Keyhole -->
    <circle cx="0" cy="-5" r="6" fill="white"/>
    <rect x="-3" y="-5" width="6" height="14" rx="3" fill="white"/>
  </g>
</svg>
